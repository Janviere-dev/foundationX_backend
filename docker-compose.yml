services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik-certs:/letsencrypt"
    networks:
      - foundationx-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override the local-dev value from .env - inside the compose
      # network, Redis is reachable by its service name, not localhost.
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - foundationx-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.foundationx.rule=Host(`${DOMAIN_NAME}`)"
      - "traefik.http.routers.foundationx.entrypoints=websecure"
      - "traefik.http.routers.foundationx.tls.certresolver=letsencrypt"
      - "traefik.http.services.foundationx.loadbalancer.server.port=8000"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - foundationx-net

volumes:
  traefik-certs:
  redis-data:

networks:
  foundationx-net:
    driver: bridge
